name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: node scripts/gen-vercel-json.mjs --check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm content:validate        # scripts/content-qa.mjs (fails on BLOCKER)
      - run: pnpm content:tokens          # unresolved tokens / broken references
      - run: pnpm legal:extract           # regenerates legal-texts.json from LEGAL_COMPLIANCE.md …
      - run: git diff --exit-code data/legal/legal-texts.json   # … which must match the committed file
      - run: pnpm legal:lint              # fails on BLOCKER; HIGH findings are reported, not build-failing
      - run: pnpm seo:lint
      - run: pnpm rates:check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e                # smoke + axe + legal-text assertions (desktop + 360px)
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }
  lighthouse:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec lhci autorun
